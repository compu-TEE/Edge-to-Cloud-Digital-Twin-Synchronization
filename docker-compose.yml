services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cc-mp-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - cc-mp-network

  kafka:
    image: apache/kafka:4.1.0
    container_name: cc-mp-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EDGE://:9096,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EDGE://proxy:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EDGE:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - cc-mp-network

  edge:
    build: ./edge
    container_name: cc-mp-edge
    restart: unless-stopped
    init: true
    cpus: 1.0
    mem_limit: 256m
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      DB_PATH: /data/edge.db
      MAX_OUTBOX_EVENTS: ${MAX_OUTBOX_EVENTS:-1000}
    ports:
      - "8081:8081"
    volumes:
      - ./data/edge:/data
    depends_on:
      - mosquitto
    networks:
      - cc-mp-network

  sensor-simulator:
    build: ./edge
    container_name: cc-mp-sensors
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      SENSOR_INTERVAL: ${SENSOR_INTERVAL:-0.1}
    command: ["python", "sensor.py"]
    depends_on:
      - mosquitto
    networks:
      - cc-mp-network



  proxy:
    build: ./proxy
    container_name: cc-mp-proxy
    ports:
      - "9095:9095"
    depends_on:
      - kafka
    networks:
      - cc-mp-network

  edge-sync:
    build: ./edge
    command: ["python", "sync.py"]
    container_name: cc-mp-edge-sync
    restart: unless-stopped
    init: true
    cpus: 1.0
    mem_limit: 256m
    environment:
      KAFKA_BOOTSTRAP_SERVERS: proxy:9094
      DB_PATH: /data/edge.db
      MAX_OUTBOX_EVENTS: ${MAX_OUTBOX_EVENTS:-1000}
    volumes:
      - ./data/edge:/data
    depends_on:
      - kafka
      - edge
    networks:
      - cc-mp-network

  cloud:
    build: ./cloud
    container_name: cc-mp-cloud
    restart: unless-stopped
    init: true
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_PATH: /data/cloud.db
    ports:
      - "8080:8080"
    volumes:
      - ./data/cloud:/data
    depends_on:
      - kafka
    networks:
      - cc-mp-network

networks:
  cc-mp-network:
    driver: bridge

volumes:
  mosquitto-data:
  mosquitto-log:
  kafka-data:
